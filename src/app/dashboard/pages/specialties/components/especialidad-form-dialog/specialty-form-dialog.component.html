<p-dialog [(visible)]="visible" [modal]="true" [draggable]="false" [resizable]="false" styleClass="w-full max-w-[450px]"
  (onHide)="cancel()">

  <ng-template pTemplate="header">
    <div class="flex items-center gap-2.5">
      <span class="w-8 h-8 rounded-lg bg-blue-50 dark:bg-blue-500/15 flex items-center justify-center flex-shrink-0">
        <i [class]="dialogIcon() + ' text-blue-600 dark:text-blue-400 text-sm'"></i>
      </span>
      <span class="text-[1rem] font-semibold text-(--p-text-color)">{{ dialogTitle() }}</span>
    </div>
  </ng-template>

  <form [formGroup]="form" class="flex flex-col gap-5 pt-2">

    <div class="flex flex-col gap-1.5">
      <label class="text-[0.75rem] font-semibold text-(--p-text-muted-color)">Nombre *</label>
      <p-iconfield>
        <p-inputicon class="pi pi-star" />
        <input pInputText formControlName="name" placeholder="Ej. Cardiología" class="w-full"
          [invalid]="form.get('name')!.invalid && form.get('name')!.touched" />
      </p-iconfield>
      @if (form.get('name')!.invalid && form.get('name')!.touched) {
      <small class="text-red-500 text-[0.76rem]">El nombre es requerido</small>
      }
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-[0.75rem] font-semibold text-(--p-text-muted-color)">Descripción</label>
      <textarea pTextarea formControlName="description" rows="3" placeholder="Breve descripción de la especialidad..."
        class="w-full resize-y"></textarea>
    </div>

  </form>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button label="Cerrar" icon="pi pi-times" [outlined]="true" severity="secondary" size="small" (onClick)="cancel()" />
      <p-button label="Guardar" icon="pi pi-check" size="small" [loading]="saving()" (onClick)="save()" />
    </div>
  </ng-template>

</p-dialog>
