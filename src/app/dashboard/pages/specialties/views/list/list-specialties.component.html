<div class="flex flex-col gap-5 w-full">

  <!-- Header -->
  <div class="flex items-start justify-between flex-wrap gap-4">
    <div>
      <h2 class="text-[1.75rem] font-bold text-(--p-text-color) m-0 tracking-[-0.7px]">Gestión de especialidades</h2>
      <p class="text-sm text-(--p-text-muted-color) mt-1 m-0">Administra las especialidades médicas disponibles en el
        sistema</p>
    </div>
    <p-button label="Nueva Especialidad" icon="pi pi-plus" (onClick)="openCreate()" />
  </div>

  <!-- Filtros -->
  <div class="bg-white dark:bg-[#1c1c1c] border border-(--p-content-border-color)
              rounded-[14px] px-5 py-4 shadow-[0_1px_3px_rgba(0,0,0,0.04)]">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 items-end">

      <div class="flex flex-col gap-1">
        <label class="text-[0.73rem] font-semibold text-(--p-text-muted-color) tracking-wide">Especialidad</label>
        <p-iconfield>
          <p-inputicon class="pi pi-star" />
          <input pInputText [(ngModel)]="filter.name" placeholder="Buscar especialidad" class="w-full" />
        </p-iconfield>
      </div>

      <div class="flex gap-2 items-center mb-0.5">
        <p-button label="Buscar" icon="pi pi-search" variant="outlined" size="small" (onClick)="search()" />
        <p-button icon="pi pi-filter-slash" [outlined]="true" size="small" severity="secondary"
          pTooltip="Limpiar filtros" tooltipPosition="top" (onClick)="clearFilters()" />
      </div>

    </div>
  </div>

  <!-- Tabla -->
  <div
    class="overflow-hidden rounded-[14px] border border-(--p-content-border-color) bg-white dark:bg-[#1c1c1c] shadow-[0_1px_3px_rgba(0,0,0,0.06)]">
    <p-table [value]="loading() ? skeletonRows : specialties()" [lazy]="true" (onLazyLoad)="loadSpecialties($event)"
      [totalRecords]="totalRecords()" [paginator]="true" [rows]="tableRows" [rowsPerPageOptions]="[10, 25, 50]"
      [showCurrentPageReport]="true" currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
      [rowHover]="true" [paginatorDropdownAppendTo]="'body'" [tableStyle]="{ 'table-layout': 'fixed', 'width': '100%' }"
      #dt>

      <ng-template pTemplate="header">
        <tr>
          <th style="width:11%">Especialidad</th>
          <th style="width:22%">Descripción</th>
          <th style="width:12%;text-align:center">Estado</th>
          <th style="width:11%; text-align:center">Acciones</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-e>
        @if (loading()) {
        <tr appTableSkeletonRow [columns]="tableColumns"></tr>
        } @else {
        <tr>

          <!-- Especialidad -->
          <td>
            <div class="flex items-center gap-3">
              <div
                class="w-9 h-9 rounded-xl bg-blue-50 dark:bg-blue-500/15 flex items-center justify-center flex-shrink-0">
                <i class="pi pi-star text-blue-600 dark:text-blue-400 text-sm"></i>
              </div>
              <span class="font-semibold text-(--p-text-color) text-[0.85rem]">{{ e.name }}</span>
            </div>
          </td>

          <!-- Descripción -->
          <td>
            <span class="block max-w-[480px] truncate text-[0.83rem] text-(--p-text-muted-color)"
              [title]="e.description">
              {{ e.description || '—' }}
            </span>
          </td>

          <!-- Estado -->
          <td>
            <div class="flex justify-center">
              <app-status-badge [value]="e.active" />
            </div>
          </td>

          <!-- Acciones -->
          <td>
            <div class="flex items-center justify-center gap-0.5">
              <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" severity="warn" size="small"
                (onClick)="openEdit(e)" pTooltip="Editar" tooltipPosition="top" />
              <p-button [icon]="e.active ? 'pi pi-ban' : 'pi pi-check-circle'" [text]="true" [rounded]="true"
                [severity]="e.active ? 'danger' : 'success'" size="small" (onClick)="confirmToggle(e)"
                [pTooltip]="e.active ? 'Desactivar' : 'Activar'" tooltipPosition="top" />
            </div>
          </td>

        </tr>
        }
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4">
            <div class="flex flex-col items-center justify-center py-14 gap-2 text-(--p-text-muted-color)">
              <i class="pi pi-star text-4xl opacity-25"></i>
              <span class="text-sm font-medium">No se encontraron especialidades</span>
              <span class="text-xs opacity-70">Intenta con otros términos de búsqueda</span>
            </div>
          </td>
        </tr>
      </ng-template>

    </p-table>
  </div>

</div>

<!-- Dialog -->
<app-specialty-form-dialog [(visible)]="dialogVisible" [mode]="dialogMode" [specialtyData]="selectedSpecialty"
  (saved)="onSaved()" />

<p-confirmdialog />
