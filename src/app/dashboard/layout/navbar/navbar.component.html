<header class="navbar">

  <!-- Left -->
  <div class="navbar-left">
    <button class="hamburger-btn" (click)="hamburgerClick.emit()">
      <i class="pi pi-bars"></i>
    </button>
    <button class="collapse-btn" (click)="collapseToggle.emit()">
      <i class="pi pi-bars"></i>
    </button>
  </div>

  <!-- Right -->
  <div class="navbar-right">

    <button class="icon-btn" (click)="theme.toggle()" pRipple
      [pTooltip]="theme.isDark() ? 'Modo claro' : 'Modo oscuro'" tooltipPosition="bottom">
      <i class="pi" [class.pi-sun]="theme.isDark()" [class.pi-moon]="!theme.isDark()"></i>
    </button>

    <button class="icon-btn" pRipple pTooltip="Notificaciones" tooltipPosition="bottom">
      <span class="notif-wrap">
        <i class="pi pi-bell"></i>
        @if (notifications > 0) {
          <span class="notif-count">{{ notifications }}</span>
        }
      </span>
    </button>

    <button class="icon-btn" pRipple pTooltip="Configuración" tooltipPosition="bottom">
      <i class="pi pi-cog"></i>
    </button>

    <div class="v-divider"></div>

    <div class="user-section">
      <p-avatar [label]="initials" shape="circle"  styleClass="nav-avatar avatar-gradient" />
      <span class="user-name">{{ username }}</span>
    </div>

    <button class="icon-btn logout-btn" (click)="logout()" pRipple pTooltip="Cerrar sesión" tooltipPosition="bottom">
      <i class="pi pi-sign-out"></i>
    </button>

  </div>

</header>

<p-confirmdialog />
